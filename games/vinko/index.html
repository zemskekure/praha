<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vínko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<!--
  Vínko: one long night with friends in Lokál Korunní, Vinohrady. Top-down pixel art; game.js holds the pub,
  the people and the light. Controls: WASD or arrows to walk, Tab to play as another friend, E to talk or order.
-->
<style>
  /* One look: dark-wood panels, paper text, Pilsner gold for the accent. */
  :root { --ink: #17110d; --panel: rgba(23, 17, 13, 0.8); --paper: #f3e9d8; --muted: #b9a993; --accent: #d9a441;
          --display: 'Silkscreen', ui-monospace, Menlo, Consolas, monospace; --body: 'VT323', ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .panel { position: fixed; background: var(--panel); padding: 6px 10px; font: 20px/1.05 var(--body); }
  #top { left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  #who { font: 12px/1.3 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #hint { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 18px; max-width: calc(100vw - 24px); }
  #pad { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: none; gap: 8px; }
  #pad button { font: 12px/1 var(--display); color: var(--paper); background: var(--panel); border: 2px solid var(--muted); padding: 14px; }
  #load { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: var(--ink); font: 18px/1.6 var(--display); letter-spacing: .12em; text-transform: uppercase; }
  #load span { font: 20px var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
  /* The intro: an enamel pub sign, then the eight of them standing in a row on a wooden shelf. */
  #intro { position: fixed; inset: 0; overflow: auto; display: grid; align-content: center; justify-items: center; gap: 0; padding: 24px 16px; box-sizing: border-box;
           background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(40,22,10,.55), rgba(10,6,3,.92)); }
  .sign { position: relative; padding: 14px 34px 12px; background: #f1e6cf; color: #8c1f1a; border: 3px solid #8c1f1a; outline: 3px solid #f1e6cf; box-shadow: 0 0 0 6px #2a1a10, 0 18px 40px rgba(0,0,0,.6), 0 0 80px rgba(255,190,110,.25); text-align: center; }
  .sign::before, .sign::after { content: ''; position: absolute; top: -26px; width: 2px; height: 22px; background: #a88a48; }
  .sign::before { left: 22%; } .sign::after { right: 22%; }
  .sign h1 { margin: 0; font: 46px/1 var(--display); letter-spacing: .06em; }
  .sign p { margin: 6px 0 0; font: 18px/1 var(--body); color: #5a3a22; letter-spacing: .04em; }
  #intro h2 { margin: 30px 0 16px; font: 13px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; font-weight: 400; color: var(--accent); }
  #cards { display: flex; gap: 2px; justify-content: center; align-items: flex-end; padding: 0 10px; border-bottom: 10px solid #5e3a21; box-shadow: 0 2px 0 #7f5131 inset, 0 12px 24px rgba(0,0,0,.5);
           background: linear-gradient(to top, rgba(255,180,90,.10), transparent 60%); }
  .card { display: grid; justify-items: center; gap: 0; padding: 0 2px; background: none; border: 0; color: var(--paper); cursor: pointer; font: inherit; position: relative; }
  .card .spr { width: min(120px, 11vw); aspect-ratio: 1; image-rendering: pixelated; transition: transform .15s; }
  .card b { margin: -4px 0 8px; padding: 3px 7px 2px; font: 10px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; font-weight: 400; background: #f1e6cf; color: #8c1f1a; border: 1px solid #8c1f1a; white-space: nowrap; }
  .card::before { content: ''; position: absolute; left: 10%; right: 10%; bottom: 10px; height: 40%; background: radial-gradient(ellipse at 50% 100%, rgba(255,200,120,.35), transparent 70%); opacity: 0; transition: opacity .15s; pointer-events: none; }
  .card:hover::before, .card:focus-visible::before, .card.mine::before { opacity: 1; }
  .card:hover .spr, .card:focus-visible .spr { transform: translateY(-4px); }
  .card:focus-visible { outline: none; } .card:focus-visible b { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.taken { cursor: not-allowed; } .card.taken .spr { filter: grayscale(1) brightness(.55); } .card.taken b { background: #8a8174; color: #2a2420; border-color: #2a2420; }
  #pick { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; min-height: 64px; margin-top: 18px; width: min(460px, 100%); }
  #pick canvas { grid-row: span 2; width: 64px; height: 64px; image-rendering: pixelated; border: 2px solid #5e3a21; }
  #pick-name { font: 14px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  #pick-line { font: 20px/1.1 var(--body); color: var(--paper); }
  #intro-note { margin: 18px 0 0; font: 18px/1.2 var(--body); color: var(--muted); text-align: center; max-width: 560px; }
  @media (max-width: 640px) { #cards { flex-wrap: wrap; border-bottom-width: 6px; } .card .spr { width: 22vw; } .sign h1 { font-size: 34px; } }
  #log { left: 12px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100vw - 24px)); display: grid; gap: 2px; font-size: 18px; }
  #log b { font-weight: 400; color: var(--accent); }
  #chat { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(520px, calc(100vw - 24px)); }
  #chat input { width: 100%; box-sizing: border-box; font: 22px/1.2 var(--body); color: var(--paper); background: rgba(23,17,13,.94); border: 2px solid var(--accent); padding: 8px 10px; outline: none; }
  #taxi { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,5,3,.7); padding: 16px; }
  .taxi-card { width: min(520px, 100%); background: #17110d; border: 2px solid #4a3220; box-shadow: 0 0 0 4px #0d0907, 0 20px 50px rgba(0,0,0,.6); padding: 0 0 16px; text-align: center; }
  .taxi-card img { display: block; width: 100%; image-rendering: pixelated; border-bottom: 2px solid #4a3220; }
  .taxi-card h2 { margin: 14px 0 6px; font: 13px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; font-weight: 400; color: var(--accent); }
  .taxi-card p { margin: 4px 16px; font: 22px/1.15 var(--body); } .taxi-card .muted { color: var(--muted); font-size: 19px; }
  .taxi-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .taxi-actions button { font: 12px/1 var(--display); color: var(--paper); background: #2a1c12; border: 2px solid var(--accent); padding: 12px 14px; cursor: pointer; }
  .taxi-actions button:disabled { opacity: .4; cursor: not-allowed; } .taxi-actions button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  @media (pointer: coarse) { #pad { display: flex; } #hint { display: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Top-down view of Lokál Korunní. Walk with WASD or the arrow keys."></canvas>
<div id="top" class="panel"><div id="clock">Út 20:00</div><div id="who">Kevin</div></div>
<div id="hint" class="panel">WASD: chůze · E: pivo, sednout, dveře, taxík · Enter: psát · Q: napít se · F: rána · G: ubalit · Esc: postava</div>
<div id="pad"><button type="button" id="btn-e">E</button><button type="button" id="btn-chat">Psát</button><button type="button" id="btn-q">Pít</button><button type="button" id="btn-f">Rána</button><button type="button" id="btn-tab">Esc</button></div>
<div id="log" class="panel" hidden aria-live="polite"></div>
<div id="chat" hidden><input id="chat-in" maxlength="120" autocomplete="off" placeholder="Napiš něco… (Enter pošle, Esc zruší)" aria-label="Zpráva"></div>
<section id="taxi" hidden role="dialog" aria-labelledby="taxi-title">
  <div class="taxi-card">
    <img id="taxi-pic" src="art/taxi-inside.png" alt="" onerror="this.remove()">
    <h2 id="taxi-title">Taxík na Šumavské</h2>
    <p id="taxi-say"></p>
    <p id="taxi-money" class="muted"></p>
    <div class="taxi-actions"><button type="button" id="taxi-buy">Sáček · 500 Kč</button><button type="button" id="taxi-no">Nic, díky</button></div>
  </div>
</section>
<section id="intro" hidden aria-labelledby="intro-title">
  <div class="sign"><h1 id="intro-title">Vínko</h1><p>Lokál Korunní · Vinohrady · úterý večer</p></div>
  <h2>Za koho dneska hraješ?</h2>
  <div id="cards" role="group" aria-label="Postavy"></div>
  <div id="pick" aria-live="polite"><canvas id="pick-face" width="64" height="64"></canvas><div id="pick-name"></div><div id="pick-line"></div></div>
  <p id="intro-note"></p>
</section>
<div id="load">Vínko<br><span>točí se první pivo…</span></div>
<script src="game.js"></script>
</body>
</html>
