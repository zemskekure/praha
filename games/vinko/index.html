<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vínko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<!--
  Vínko: one long night with friends in Lokál Korunní, Vinohrady. Top-down pixel art; game.js holds the pub,
  the people and the light. Controls: WASD or arrows to walk, Tab to play as another friend, E to talk or order.
-->
<style>
  /* One look: dark-wood panels, paper text, Pilsner gold for the accent. */
  :root { --ink: #17110d; --panel: rgba(23, 17, 13, 0.8); --paper: #f3e9d8; --muted: #b9a993; --accent: #d9a441;
          --display: 'Silkscreen', ui-monospace, Menlo, Consolas, monospace; --body: 'VT323', ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .panel { position: fixed; background: var(--panel); padding: 6px 10px; font: 20px/1.05 var(--body); }
  #top { left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  #who { font: 12px/1.3 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #hint { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 18px; max-width: calc(100vw - 24px); }
  #pad { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: none; gap: 8px; }
  #pad button { font: 12px/1 var(--display); color: var(--paper); background: var(--panel); border: 2px solid var(--muted); padding: 14px; }
  #load { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: var(--ink); font: 18px/1.6 var(--display); letter-spacing: .12em; text-transform: uppercase; }
  #load span { font: 20px var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
  #intro { position: fixed; inset: 0; overflow: auto; display: grid; align-content: center; justify-items: center; gap: 10px; padding: 24px 16px; box-sizing: border-box;
           background: radial-gradient(ellipse at 50% 30%, rgba(60,36,18,.82), rgba(16,10,6,.94)); }
  #intro h1 { margin: 0; font: 40px/1 var(--display); letter-spacing: .1em; color: var(--accent); text-shadow: 0 3px 0 #000; }
  #intro .sub { margin: 0; font: 22px/1 var(--body); color: var(--muted); }
  #intro h2 { margin: 14px 0 4px; font: 14px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; font-weight: 400; }
  #cards { display: grid; grid-template-columns: repeat(4, minmax(0, 150px)); gap: 10px; width: 100%; max-width: 640px; justify-content: center; }
  @media (max-width: 560px) { #cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } #intro h1 { font-size: 30px; } }
  .card { display: grid; justify-items: center; gap: 2px; padding: 10px 6px 8px; background: var(--panel); color: var(--paper); border: 2px solid #4a3220; cursor: pointer; font: 18px/1.05 var(--body); }
  .card:hover:not(:disabled), .card:focus-visible { border-color: var(--accent); outline: none; background: rgba(60,38,20,.9); }
  .card .face { width: 96px; height: 68px; image-rendering: pixelated; }
  .card b { font: 12px/1.4 var(--display); letter-spacing: .06em; text-transform: uppercase; font-weight: 400; }
  .card span { color: var(--muted); text-align: center; }
  .card i { font-style: normal; color: var(--accent); font-size: 16px; }
  .card.taken { opacity: .45; cursor: not-allowed; } .card.taken i { color: var(--muted); }
  #intro-note { margin: 8px 0 0; font: 20px/1.2 var(--body); color: var(--muted); text-align: center; max-width: 560px; }
  @media (pointer: coarse) { #pad { display: flex; } #hint { display: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Top-down view of Lokál Korunní. Walk with WASD or the arrow keys."></canvas>
<div id="top" class="panel"><div id="clock">Út 20:00</div><div id="who">Kevin</div></div>
<div id="hint" class="panel">WASD / šipky: chůze · E: mluvit, objednat · Esc: vyměnit postavu</div>
<div id="pad"><button type="button" id="btn-e">E</button><button type="button" id="btn-tab">Esc</button></div>
<section id="intro" hidden aria-labelledby="intro-title">
  <h1 id="intro-title">Vínko</h1>
  <p class="sub">Lokál Korunní · Vinohrady · úterý večer</p>
  <h2>Za koho dneska hraješ?</h2>
  <div id="cards"></div>
  <p id="intro-note"></p>
</section>
<div id="load">Vínko<br><span>točí se první pivo…</span></div>
<script src="game.js"></script>
</body>
</html>
